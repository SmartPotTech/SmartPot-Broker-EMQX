version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    ignore:
      # EMQX 5.8.x es la última versión open source (Apache-2.0); desde 5.9 el broker pasó a licencia BSL.
      # Solo se aceptan parches dentro de 5.8.x; se ignoran minor y major (5.9, 5.10 y 6.x son BSL).
      - dependency-name: "emqx/emqx"
        update-types: [ "version-update:semver-minor", "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
