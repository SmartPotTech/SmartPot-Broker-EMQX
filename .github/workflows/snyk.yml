name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Escaneo semanal los lunes a las 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  snyk-container:
    name: Snyk Container (EMQX)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Build Docker Image
        run: docker build -t smartpot-broker-emqx:ci .

      - name: Run Snyk Container Test
        run: |
          snyk container test smartpot-broker-emqx:ci --file=Dockerfile --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold=medium --sarif-file-output=snyk-container.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              echo "::warning::Snyk detectó advertencias en la imagen de contenedor."
            else
              echo "::error::Error al ejecutar Snyk Container CLI (código $code)."
              exit $code
            fi
          }

      - name: Upload Container SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
